<script>
    let map;
    const markerMap = {};

    function initMap(mapDataUrl){
        map = L.map('map').setView([8.366169846753188, 124.86501751675435], 17);
        
        //OpenStreetMapLayer
        const openStreetMap = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom:19,
            attribution:'&copy; OpenStreetMap contributors'
        });

        //Satellite
        const satellite = L.tileLayer(
        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        {attribution: 'Tiles (c) Esri - Source: Esri, Maxar, Earthstar Geographics, GIS User Community'}
        );

        openStreetMap.addTo(map);
        console.log("Base map tile layer loaded" + Date());

        const markerGroups ={};
        
        const customIcon = L.icon({
        iconUrl: 'MotoMarker.png',
        iconSize: [60, 60],
        iconAnchor: [30, 40],   
        popupAnchor: [10, -40]
    });
        fetch(mapDataUrl)
        .then(response => response.json())
        .then(data => {
            data.forEach(pin => {
                const type = pin.locationType || "Other";
                
                //Create Marker Group
                if (!markerGroups[type]){
                    markerGroups[type]= L.layerGroup();
                }

                //Marker and popup
                const marker = L.marker([pin.lat, pin.lng], { icon: customIcon }).addTo(map);

                const img = `<img src = '${pin.img}' class = "popup-image">`;

                marker.bindPopup(`${img}<br><b> ${pin.title} </b><br> ${pin.description} <br> ${pin.locationType}`)
                console.log (`${pin.name} loaded` +Date());


                markerGroups[type].addLayer(marker);

                 markerMap[pin.id] = marker;
            });
            //Add all Groups to map initially
            Object.values(markerGroups).forEach(group => group.addTo(map));

            //Layer control
            const baseMaps={
                "OpenStreetMap": openStreetMap,
                "Satellite" : satellite
            }

            const overlayMaps={};

            //Add marker groups to the map accroding to layer filter
            Object.keys(markerGroups).forEach(type=>{
                overlayMaps[type] = markerGroups[type];
            });
            // Add all elements into the map
            L.control.layers(baseMaps,overlayMaps,{collapsed:false}).addTo(map);
            })
            .catch(err => console.error('Error loading JSON', err));



        }

     function renderCards(HabalDataUrl,containerId){
        fetch(HabalDataUrl)
        .then(response => response.json())
        .then(data => {
            const container = document.getElementById(containerId);
            container.innerHTML = "";

            data.forEach(pin=>{
                const cardHTML = `
                <div class="card mb-2"data-crid="${pin.id}">
                        <div class="card-body">
                            <div class="row">
                                <div class="col-4">
                                    <img src="${pin.img}" class="card-img-top" alt="...">
                                </div>
                                <div class="col-8">
                                    <h5 class="card-title">${pin.title}</h5>
                                    <p class="card-text">${pin.description}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML +=cardHTML;
            });
             container.querySelectorAll('.card').forEach(card => {
                card.addEventListener('click', () => {
                    const HabalID = card.getAttribute('data-crid');
                    const marker = markerMap[HabalID];
                    if(marker){
                        map.flyTo(marker.getLatLng(), 19, { duration: .5 });
                        marker.openPopup();
                    }
                });
            });
        })
        .catch(error=> console.error("Error Loading JSON", error));
     }
    document.addEventListener("DOMContentLoaded", ()=>{
        initMap('data.json');
        renderCards('data.json', 'HabalTerminalList');
    });


   
 </script>
